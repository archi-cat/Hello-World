name: Application — Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy web and API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      # Use the first 8 characters of the commit SHA as the image tag.
      # Both images get the same tag so they are always deployed as a
      # matched pair from the same commit.
      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      # ── Web app ─────────────────────────────────────────────────────────────

      - name: Build web Docker image
        run: |
          docker build \
            -f ./app/web/Dockerfile \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/hello-world-web:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/hello-world-web:latest \
            ./app/web

      - name: Push web Docker image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/hello-world-web:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/hello-world-web:latest

      - name: Deploy web to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.WEB_APP_NAME }}
          images: ${{ secrets.ACR_NAME }}.azurecr.io/hello-world-web:${{ steps.tag.outputs.IMAGE_TAG }}

      # ── API ──────────────────────────────────────────────────────────────────

      - name: Build API Docker image
        run: |
          docker build \
            -f ./app/api/Dockerfile \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/hello-world-api:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/hello-world-api:latest \
            ./app/api

      - name: Push API Docker image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/hello-world-api:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/hello-world-api:latest

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.API_APP_NAME }}
          images: ${{ secrets.ACR_NAME }}.azurecr.io/hello-world-api:${{ steps.tag.outputs.IMAGE_TAG }}

      # ── Summary ──────────────────────────────────────────────────────────────

      - name: Print deployed URLs
        run: |
          echo "Web app: https://${{ secrets.WEB_APP_NAME }}.azurewebsites.net"
          echo "API:     https://${{ secrets.API_APP_NAME }}.azurewebsites.net"
          echo "Tag:     ${{ steps.tag.outputs.IMAGE_TAG }}"

  configure-sql:
    name: Configure SQL Managed Identity access
    runs-on: windows-latest
    needs: build-and-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Wait for Managed Identity to propagate
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Run SQL setup script
        shell: pwsh
        run: |
          ./scripts/Set-SqlManagedIdentity.ps1 `
            -SqlServerFqdn "${{ secrets.SQL_SERVER_NAME }}.database.windows.net" `
            -SqlDatabaseName "${{ secrets.SQL_DATABASE_NAME }}" `
            -ApiAppServiceName "${{ secrets.API_APP_NAME }}"